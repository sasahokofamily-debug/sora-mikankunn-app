<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みかんくん3Dレース</title><link rel="stylesheet" href="style.css"></head><body>
<main class="app">
<section id="titleScreen" class="panel"><div class="logo">🍊</div><h1>みかんくん 3Dレース</h1><p>AIカート3台と競争！ カーブとブーストで1位をめざそう。</p><button id="startButton">レーススタート</button><p class="note">← → / A D：左右　Space / BOOST：加速</p></section>
<section id="gameScreen" class="panel hidden">
<header class="hud"><span>順位 <b id="rank">1/4</b></span><span>距離 <b id="distance">0m</b></span><span>速度 <b id="speed">0</b></span></header>
<div id="canvasWrap" class="canvasWrap"><div id="floatingMessage" class="msg">GO!</div><div class="boostMeter">BOOST<div class="bar"><div id="boostFill"></div></div></div><div id="gameOverPanel" class="over hidden"><h2 id="resultTitle">ゴール！</h2><p id="resultText"></p><button id="restartButton">もういちど</button></div></div>
<div class="controls"><button id="leftButton">←</button><button id="boostButton" class="boost">BOOST</button><button id="rightButton">→</button><button id="restartMiniButton">リスタート</button></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script><script src="script.js"></script></body></html>
